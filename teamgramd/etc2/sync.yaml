Name: messenger.sync
Shutdown:
  WaitTime: 35s
ListenOn: 0.0.0.0:20420
Etcd:
  Hosts:
    - etcd:2379
  Key: messenger.sync
Log:
  ServiceName: messenger.sync
  #Mode: file
  #Path: ../logs/sync
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20421
  Path: /metrics
# #链路追踪
# Telemetry:
#   Name: messenger.sync
#   Endpoint: jaeger:4317
#   Sampler: 1.0
#   Batcher: otlpgrpc
  
SyncConsumer:
  Topics:
    - "Sync-T"
    - "BotFather-T"
  Brokers:
    - kafka:9092
  Group: "Sync-MainCommunity-S"

Routine:
  Chan: 16
  Size: 100

Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  MaxConns: 8
  MinConns: 1
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s

Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379

IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status
SessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session

ChannelClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
ChatClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service

UserClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service

MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
