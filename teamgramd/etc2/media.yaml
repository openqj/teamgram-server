Name: service.media
ListenOn: 0.0.0.0:20650
Etcd:
  Hosts:
    - etcd:2379
  Key: service.media
Timeout: 0
Log:
  ServiceName: service.media
  #Mode: file
  #Path: ../logs/media
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20651
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.media
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  MaxConns: 32
  MinConns: 4
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s

Cache:
  - Host: redis:6379

Dfs:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 0
