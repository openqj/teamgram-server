Name: service.authsession
ListenOn: 0.0.0.0:20450
Etcd:
  Hosts:
    - etcd:2379
  Key: service.authsession
Log:
  ServiceName: service.authsession
  #Mode: file
  #Path: ../logs/authsession
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20451
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.authsession
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  ApplicationName: teamgram-authsession
  MaxConns: 8
  MinConns: 1
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s
  
Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379
