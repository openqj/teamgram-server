Name: service.authsession
ListenOn: 0.0.0.0:20450
Etcd:
  Hosts:
    - etcd:2379
  Key: service.authsession
Log:
  ServiceName: service.authsession
  #Mode: file
  #Path: ../logs/authsession
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20451
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.authsession
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Postgres:
  DSN: postgres://teamgram:teamgram@postgres:5432/teamgram?sslmode=disable
  MaxConns: 64
  MinConns: 8
  
Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379
