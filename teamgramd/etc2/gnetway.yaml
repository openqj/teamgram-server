Name: interface.gateway
ListenOn: 0.0.0.0:20110
Etcd:
  Hosts:
    - etcd:2379
  Key: interface.gateway
Log:
  ServiceName: interface.gateway
  #Mode: file
  #Path: ../logs/gnetway
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20111
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.gateway
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
RSAKey:
  - KeyFile: "./server_pkcs1.key"
    KeyFingerprint: "12240908862933197005"
KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"
MaxProc: 4

Gnetway:
  Server:
    - Proto: tcp
      Addresses:
        - 0.0.0.0:10443
        - 0.0.0.0:5222
    - Proto: websocket
      Addresses:
        - 0.0.0.0:11443
    - Proto: http
      Addresses:
        - 0.0.0.0:11443
  # Keep independent MTProto connections on separate gnet event loops. This
  # is required for the local 1000-online-session acceptance profile.
  Multicore: true
  SendBuf: 65536
  ReceiveBuf: 65536
  # Process-local admission and asynchronous work budgets. Account quotas must
  # be coordinated by the session service when multiple gateways are active.
  MaxConnections: 10000
  MaxConnectionsPerIP: 0
  ConnectionRatePerIP: 0
  ConnectionBurstPerIP: 0
  MaxConnectionsPerAuthKey: 0
  MaxHandshakesInFlight: 512
  HandshakeRatePerIP: 0
  HandshakeBurstPerIP: 0
  WorkerPoolSize: 512
  WebsocketMaxMessageBytes: 16777216
  TCPKeepAliveSeconds: 60
  TCPNoDelay: true

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
UseStreamSession: true
