Name: service.idgen
ListenOn: 0.0.0.0:20660
Etcd:
  Hosts:
    - etcd:2379
  Key: service.idgen
Log:
  ServiceName: service.idgen
  #Mode: file
  #Path: ../logs/idgen
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20661
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.idgen
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
NodeId: 1

Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  ApplicationName: teamgram-idgen
  MaxConns: 16
  MinConns: 2
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s
