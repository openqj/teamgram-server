Http:
  Name: interface.httpserver
  Host: 0.0.0.0
  Port: 8801
  Timeout: 0
  MaxBytes: 67108864
  Log:
    ServiceName: interface.httpserver
    #Mode: file
    #Path: ../logs/httpserver
    Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.httpserver
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
  Timeout: 0

Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  MaxConns: 16
  MinConns: 2
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s

PaymentProviderName: external
PaymentProviderWebhookSigningKey: ""
PaymentProviderWebhookMaxBodyBytes: 1048576

UserClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
ChatClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg

BffClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: bff.bff

DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
