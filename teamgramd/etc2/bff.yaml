Name: bff.bff
ListenOn: 0.0.0.0:20010
DcId: 2
# This isolated deployment is an explicitly shared authority for DC 1 and 2.
# Leave this unset in a single-DC deployment so cross-DC transfers fail closed.
KnownDcIds:
  - 1
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 0
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379
PostgresDSN: ${TEAMGRAM_POSTGRES_DSN}

SearchPostsFlood:
  TotalDaily: 10

PaymentProviderEndpoint: ""
PaymentProviderKey: ""
PaymentProviderSigningKey: ""
PaymentProviderTimeoutSeconds: 5

AuthProviderEndpoint: ""
AuthProviderKey: ""
AuthProviderSigningKey: ""
AuthProviderTimeoutSeconds: 5

GroupCallMediaEndpoint: ""
GroupCallMediaAPIKey: ""
GroupCallMediaSigningKey: ""
GroupCallMediaRTMPHost: ""
GroupCallMediaTimeoutSeconds: 5

# The isolated stack has an explicit HTTPS RP so passkey ceremonies can be
# exercised end to end. Keep this block out of the production config: the
# trusted app hash is fixture-only and must be replaced by deployment secrets.
Passkey:
  RelyingPartyId: passkey.teamgram.local
  RelyingPartyDisplayName: Teamgram Isolated
  Origins:
    - https://passkey.teamgram.local
  TrustedApps:
    - ApiId: 1
      ApiHash: 0123456789abcdef0123456789abcdef

# QR login uses the same fixture application registry in the isolated stack.
# Production must replace this with deployment-managed app credentials.
QrCode:
  TrustedApps:
    - ApiId: 1
      ApiHash: 0123456789abcdef0123456789abcdef

Code:
  Name: "none"
  SendCodeUrl: ""
  VerifyCodeUrl: ""
  Key: ""
  Secret: ""
  ChallengeSecret: ""
  RegionId: ""

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
AuthSessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 0
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 0
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 0
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - kafka:9092
