Name: service.biz_service
ListenOn: 0.0.0.0:20020
Etcd:
  Hosts:
    - etcd:2379
  Key: service.biz_service
Log:
  ServiceName: service.biz_service
  #Mode: file
  #Path: ../logs/biz
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20021
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.biz_service
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
Postgres:
  DSN: ${TEAMGRAM_POSTGRES_DSN}
  ApplicationName: teamgram-biz
  MaxConns: 8
  MinConns: 1
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s

Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379

MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
