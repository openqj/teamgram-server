services:
  postgres:
    image: postgres:18
    container_name: teamgram-postgres
    command:
      - postgres
      - -c
      - max_connections=${TEAMGRAM_POSTGRES_MAX_CONNECTIONS:-256}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamgram}
      POSTGRES_USER: ${POSTGRES_USER:-teamgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamgram}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      teamgram_net:
        aliases:
          - postgres

  postgres-migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamgram}:${POSTGRES_PASSWORD:-teamgram}@postgres:5432/${POSTGRES_DB:-teamgram}?sslmode=disable
    volumes:
      - ./teamgramd/deploy:/workspace/teamgramd/deploy:ro
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - /workspace/teamgramd/deploy/postgres/apply.sh
    restart: "no"
    networks:
      - teamgram_net

  teamgram:
    build:
      context: .
      additional_contexts:
        proto: ../proto
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    pids_limit: 8192
    cpus: "${TEAMGRAM_CPU_LIMIT:-4.0}"
    mem_limit: "${TEAMGRAM_MEMORY_LIMIT:-8g}"
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    restart: always
    environment:
      TEAMGRAM_POSTGRES_DSN: postgresql://${POSTGRES_USER:-teamgram}:${POSTGRES_PASSWORD:-teamgram}@postgres:5432/${POSTGRES_DB:-teamgram}?sslmode=disable
      TEAMGRAM_SYNC_POSTGRES_MAX_CONNS: ${TEAMGRAM_SYNC_POSTGRES_MAX_CONNS:-16}
      TEAMGRAM_CORS_ORIGINS: ${TEAMGRAM_CORS_ORIGINS:-}
      TEAMGRAM_SUB2API_INTERNAL_BASE_URL: ${TEAMGRAM_SUB2API_INTERNAL_BASE_URL:-}
      TEAMGRAM_SUB2API_SERVICE_TOKEN: ${TEAMGRAM_SUB2API_SERVICE_TOKEN:-}
      TEAMGRAM_SUB2API_TIMEOUT_SECONDS: ${TEAMGRAM_SUB2API_TIMEOUT_SECONDS:-5}
      TEAMGRAM_IDENTITY_BASE_URL: ${TEAMGRAM_IDENTITY_BASE_URL:-}
      TEAMGRAM_IDENTITY_TEAMGRAM_SERVICE_TOKEN: ${TEAMGRAM_IDENTITY_TEAMGRAM_SERVICE_TOKEN:-}
      TEAMGRAM_IDENTITY_INSTANCE_ID: ${TEAMGRAM_IDENTITY_INSTANCE_ID:-default}
      S3_ENDPOINT: ${S3_ENDPOINT:-seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfs-secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_MAX_IDLE_CONNS: ${S3_MAX_IDLE_CONNS:-256}
      S3_MAX_IDLE_CONNS_PER_HOST: ${S3_MAX_IDLE_CONNS_PER_HOST:-64}
      S3_MAX_CONNS_PER_HOST: ${S3_MAX_CONNS_PER_HOST:-0}
      S3_IDLE_CONN_TIMEOUT_SECONDS: ${S3_IDLE_CONN_TIMEOUT_SECONDS:-60}
      S3_RESPONSE_HEADER_TIMEOUT_SECONDS: ${S3_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}
      S3_UPLOAD_PART_SIZE_MIB: ${S3_UPLOAD_PART_SIZE_MIB:-16}
      S3_UPLOAD_CONCURRENCY: ${S3_UPLOAD_CONCURRENCY:-4}
      TEAMGRAM_IDENTITY_REPLAY_REDIS_HOST: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_HOST:-}
      TEAMGRAM_IDENTITY_REPLAY_REDIS_PASS: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_PASS:-}
      TEAMGRAM_IDENTITY_REPLAY_REDIS_TLS: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_TLS:-false}
      TEAMGRAM_IDENTITY_REPLAY_TTL_SECONDS: ${TEAMGRAM_IDENTITY_REPLAY_TTL_SECONDS:-60}
      TEAMGRAM_IDENTITY_REQUEST_TIMEOUT_SECONDS: ${TEAMGRAM_IDENTITY_REQUEST_TIMEOUT_SECONDS:-5}
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "10443:10443"
      - "11443:11443"
      - "20450:20450"
      - "20010:20010"
      - "20020:20020"
      - "20640:20640"
      - "20110:20110"
      - "5222:5222"
      - "8801:8801"
      - "20660:20660"
      - "20650:20650"
      - "20030:20030"
      - "20120:20120"
      - "20670:20670"
      - "20420:20420"
    networks:
      - teamgram_net

networks:
  teamgram_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
