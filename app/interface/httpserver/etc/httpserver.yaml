Http:
  Name: interface.httpserver
  Host: 0.0.0.0
  Port: 8801
  Timeout: 0
  MaxBytes: 67108864
  Log:
    ServiceName: interface.httpserver
    Mode: file
    Path: ../logs/httpserver
    Level: debug

KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"

Session:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session
  Timeout: 0

AuthsessionClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
  Timeout: 0

Postgres:
  DSN: postgres://teamgram:teamgram@127.0.0.1:5432/teamgram?sslmode=disable
  MaxConns: 16
  MinConns: 2
  MaxConnLifetime: 1h
  MaxConnIdleTime: 30m
  HealthCheckPeriod: 1m
  ConnectTimeout: 10s

PaymentProviderName: external
PaymentProviderWebhookSigningKey: ""
PaymentProviderWebhookMaxBodyBytes: 1048576

# Optional Product Identity bridge. Set all values, including shared Redis
# replay storage, to enable POST /v1/internal/aimemory/token.
IdentityBaseURL: ${TEAMGRAM_IDENTITY_BASE_URL}
IdentityTeamgramServiceToken: ${TEAMGRAM_IDENTITY_TEAMGRAM_SERVICE_TOKEN}
IdentityTeamgramInstanceID: ${TEAMGRAM_IDENTITY_INSTANCE_ID}
IdentityReplayTTLSeconds: 60
IdentityRequestTimeoutSeconds: ${TEAMGRAM_IDENTITY_REQUEST_TIMEOUT_SECONDS}
IdentityReplayKV:
  - Host: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_HOST}
    Pass: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_PASS}
    Tls: ${TEAMGRAM_IDENTITY_REPLAY_REDIS_TLS}

UserClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
ChatClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
MsgClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: messenger.msg

BffClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: bff.bff

DfsClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
