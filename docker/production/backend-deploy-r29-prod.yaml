services:
  postgres:
    image: postgres:18
    container_name: teamgram-postgres
    command:
      - postgres
      - -c
      - "max_connections=${TEAMGRAM_POSTGRES_MAX_CONNECTIONS:-256}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teamgram_net

  postgres-migrate:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
    volumes:
      # Paths resolve from the root compose file; set TEAMGRAM_DEPLOY_DIR to
      # ../../teamgramd/deploy only when running this overlay standalone.
      - ${TEAMGRAM_DEPLOY_DIR:-./teamgramd/deploy}:/workspace/teamgramd/deploy:ro
    entrypoint: ["/bin/bash", "-euc"]
    command: ["/workspace/teamgramd/deploy/postgres/apply.sh"]
    restart: "no"
    networks:
      - teamgram_net

  backend:
    image: "${TEAMGRAM_BACKEND_IMAGE:?TEAMGRAM_BACKEND_IMAGE is required}"
    build: !reset null
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    pids_limit: 8192
    cpus: "${TEAMGRAM_CPU_LIMIT:-4.0}"
    mem_limit: "${TEAMGRAM_MEMORY_LIMIT:-8g}"
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_max_syn_backlog: "65535"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    networks:
      - teamgram_net
    # Replace the base compose environment wholesale. Older local base files
    # may still define MYSQL_URI; inheriting that key would violate the
    # PostgreSQL-only runtime contract even when TEAMGRAM_POSTGRES_DSN is set.
    environment: !override
      KAFKA_HOST: "${KAFKA_HOST:?KAFKA_HOST is required}"
      TEAMGRAM_POSTGRES_DSN: "${TEAMGRAM_POSTGRES_DSN:?TEAMGRAM_POSTGRES_DSN is required}"
      TEAMGRAM_SYNC_POSTGRES_MAX_CONNS: "${TEAMGRAM_SYNC_POSTGRES_MAX_CONNS:-16}"
      TEAMGRAM_KAFKA_DLQ_TOPIC: "${TEAMGRAM_KAFKA_DLQ_TOPIC:?Pre-create a Kafka dead-letter topic}"
      TEAMGRAM_KAFKA_MAX_HANDLER_ATTEMPTS: "${TEAMGRAM_KAFKA_MAX_HANDLER_ATTEMPTS:-10}"
      TEAMGRAM_KAFKA_RETRY_DELAY_MS: "${TEAMGRAM_KAFKA_RETRY_DELAY_MS:-1000}"
      TEAMGRAM_KAFKA_HANDLER_CONCURRENCY: "${TEAMGRAM_KAFKA_HANDLER_CONCURRENCY:-64}"
      TEAMGRAM_APIFULL_SCHEMA_READONLY: "true"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_MAX_IDLE_CONNS: "${S3_MAX_IDLE_CONNS:-256}"
      S3_MAX_IDLE_CONNS_PER_HOST: "${S3_MAX_IDLE_CONNS_PER_HOST:-64}"
      S3_MAX_CONNS_PER_HOST: "${S3_MAX_CONNS_PER_HOST:-0}"
      S3_IDLE_CONN_TIMEOUT_SECONDS: "${S3_IDLE_CONN_TIMEOUT_SECONDS:-60}"
      S3_RESPONSE_HEADER_TIMEOUT_SECONDS: "${S3_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}"
      S3_UPLOAD_PART_SIZE_MIB: "${S3_UPLOAD_PART_SIZE_MIB:-16}"
      S3_UPLOAD_CONCURRENCY: "${S3_UPLOAD_CONCURRENCY:-4}"
      TEAMGRAM_TURN_HOST: "${TEAMGRAM_TURN_HOST:-}"
      TEAMGRAM_TURN_PORT: "${TEAMGRAM_TURN_PORT:-3478}"
      TEAMGRAM_TURN_USERNAME: "${TEAMGRAM_TURN_USERNAME:-}"
      TEAMGRAM_TURN_PASSWORD: "${TEAMGRAM_TURN_PASSWORD:-}"
      TEAMGRAM_TURN_SHARED_SECRET: "${TEAMGRAM_TURN_SHARED_SECRET:-}"
      TEAMGRAM_TURN_CREDENTIAL_TTL_SECONDS: "${TEAMGRAM_TURN_CREDENTIAL_TTL_SECONDS:-3600}"
      TEAMGRAM_PASSKEY_RP_ID: "${TEAMGRAM_PASSKEY_RP_ID:-}"
      TEAMGRAM_PASSKEY_RP_DISPLAY_NAME: "${TEAMGRAM_PASSKEY_RP_DISPLAY_NAME:-}"
      TEAMGRAM_PASSKEY_ORIGINS: "${TEAMGRAM_PASSKEY_ORIGINS:-}"
      TEAMGRAM_PASSKEY_TRUSTED_APPS: "${TEAMGRAM_PASSKEY_TRUSTED_APPS:-}"
      TEAMGRAM_PAYMENT_PROVIDER_ENDPOINT: "${TEAMGRAM_PAYMENT_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_PAYMENT_PROVIDER_NAME: "${TEAMGRAM_PAYMENT_PROVIDER_NAME:-external}"
      TEAMGRAM_PAYMENT_PROVIDER_KEY: "${TEAMGRAM_PAYMENT_PROVIDER_KEY:-}"
      TEAMGRAM_PAYMENT_PROVIDER_SIGNING_KEY: "${TEAMGRAM_PAYMENT_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_PAYMENT_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_PAYMENT_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_PAYMENT_PROVIDER_WEBHOOK_SIGNING_KEY: "${TEAMGRAM_PAYMENT_PROVIDER_WEBHOOK_SIGNING_KEY:-}"
      TEAMGRAM_PAYMENT_PROVIDER_WEBHOOK_MAX_BODY_BYTES: "${TEAMGRAM_PAYMENT_PROVIDER_WEBHOOK_MAX_BODY_BYTES:-1048576}"
      TEAMGRAM_PAYMENT_RECONCILIATION_INTERVAL_SECONDS: "${TEAMGRAM_PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-30}"
      TEAMGRAM_PAYMENT_RECONCILIATION_BATCH_SIZE: "${TEAMGRAM_PAYMENT_RECONCILIATION_BATCH_SIZE:-50}"
      TEAMGRAM_SUB2API_INTERNAL_BASE_URL: "${TEAMGRAM_SUB2API_INTERNAL_BASE_URL:-}"
      TEAMGRAM_SUB2API_SERVICE_TOKEN: "${TEAMGRAM_SUB2API_SERVICE_TOKEN:-}"
      TEAMGRAM_SUB2API_TIMEOUT_SECONDS: "${TEAMGRAM_SUB2API_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_IDENTITY_BASE_URL: "${TEAMGRAM_IDENTITY_BASE_URL:-}"
      TEAMGRAM_IDENTITY_TEAMGRAM_SERVICE_TOKEN: "${TEAMGRAM_IDENTITY_TEAMGRAM_SERVICE_TOKEN:-}"
      TEAMGRAM_IDENTITY_INSTANCE_ID: "${TEAMGRAM_IDENTITY_INSTANCE_ID:-}"
      TEAMGRAM_AI_PROVIDER_ENDPOINT: "${TEAMGRAM_AI_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_AI_PROVIDER_KEY: "${TEAMGRAM_AI_PROVIDER_KEY:-}"
      TEAMGRAM_AI_PROVIDER_SIGNING_KEY: "${TEAMGRAM_AI_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_AI_PROVIDER_MODEL: "${TEAMGRAM_AI_PROVIDER_MODEL:-gpt-6.1-sol}"
      TEAMGRAM_AI_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_AI_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_BUSINESS_PROVIDER_ENDPOINT: "${TEAMGRAM_BUSINESS_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_BUSINESS_PROVIDER_KEY: "${TEAMGRAM_BUSINESS_PROVIDER_KEY:-}"
      TEAMGRAM_BUSINESS_PROVIDER_SIGNING_KEY: "${TEAMGRAM_BUSINESS_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_BUSINESS_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_BUSINESS_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_SPONSORED_PROVIDER_ENDPOINT: "${TEAMGRAM_SPONSORED_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_SPONSORED_PROVIDER_KEY: "${TEAMGRAM_SPONSORED_PROVIDER_KEY:-}"
      TEAMGRAM_SPONSORED_PROVIDER_SIGNING_KEY: "${TEAMGRAM_SPONSORED_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_SPONSORED_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_SPONSORED_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_CDN_PROVIDER_ENDPOINT: "${TEAMGRAM_CDN_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_CDN_PROVIDER_KEY: "${TEAMGRAM_CDN_PROVIDER_KEY:-}"
      TEAMGRAM_CDN_PROVIDER_SIGNING_KEY: "${TEAMGRAM_CDN_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_CDN_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_CDN_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_BOT_CONNECTION_PROVIDER_ENDPOINT: "${TEAMGRAM_BOT_CONNECTION_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_BOT_CONNECTION_PROVIDER_KEY: "${TEAMGRAM_BOT_CONNECTION_PROVIDER_KEY:-}"
      TEAMGRAM_BOT_CONNECTION_PROVIDER_SIGNING_KEY: "${TEAMGRAM_BOT_CONNECTION_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_BOT_CONNECTION_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_BOT_CONNECTION_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_AUTH_PROVIDER_ENDPOINT: "${TEAMGRAM_AUTH_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_AUTH_PROVIDER_KEY: "${TEAMGRAM_AUTH_PROVIDER_KEY:-}"
      TEAMGRAM_AUTH_PROVIDER_SIGNING_KEY: "${TEAMGRAM_AUTH_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_AUTH_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_AUTH_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_PASSPORT_PROVIDER_ENDPOINT: "${TEAMGRAM_PASSPORT_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_PASSPORT_PROVIDER_KEY: "${TEAMGRAM_PASSPORT_PROVIDER_KEY:-}"
      TEAMGRAM_PASSPORT_PROVIDER_SIGNING_KEY: "${TEAMGRAM_PASSPORT_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_PASSPORT_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_PASSPORT_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_USERCHANNELPROFILES_PROVIDER_ENDPOINT: "${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_USERCHANNELPROFILES_PROVIDER_KEY: "${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_KEY:-}"
      TEAMGRAM_USERCHANNELPROFILES_PROVIDER_SIGNING_KEY: "${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_USERCHANNELPROFILES_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_CODE_SMS_PROVIDER: "${TEAMGRAM_CODE_SMS_PROVIDER:-}"
      TEAMGRAM_CODE_EMAIL_PROVIDER: "${TEAMGRAM_CODE_EMAIL_PROVIDER:-}"
      TEAMGRAM_CODE_SEND_URL: "${TEAMGRAM_CODE_SEND_URL:-}"
      TEAMGRAM_CODE_EMAIL_SEND_URL: "${TEAMGRAM_CODE_EMAIL_SEND_URL:-}"
      TEAMGRAM_CODE_REPORT_MISSING_URL: "${TEAMGRAM_CODE_REPORT_MISSING_URL:-}"
      TEAMGRAM_CODE_VERIFY_URL: "${TEAMGRAM_CODE_VERIFY_URL:-}"
      TEAMGRAM_CODE_KEY: "${TEAMGRAM_CODE_KEY:-}"
      TEAMGRAM_CODE_SECRET: "${TEAMGRAM_CODE_SECRET:-}"
      TEAMGRAM_CODE_CHALLENGE_SECRET: "${TEAMGRAM_CODE_CHALLENGE_SECRET:-}"
      TEAMGRAM_CODE_REGION_ID: "${TEAMGRAM_CODE_REGION_ID:-}"
      TEAMGRAM_CODE_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_CODE_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_CODE_PROVIDER_RETRY_COUNT: "${TEAMGRAM_CODE_PROVIDER_RETRY_COUNT:-0}"
      TEAMGRAM_CODE_CHALLENGE_TTL_SECONDS: "${TEAMGRAM_CODE_CHALLENGE_TTL_SECONDS:-900}"
      TEAMGRAM_CODE_RATE_LIMIT: "${TEAMGRAM_CODE_RATE_LIMIT:-0}"
      TEAMGRAM_CODE_RATE_WINDOW_SECONDS: "${TEAMGRAM_CODE_RATE_WINDOW_SECONDS:-0}"
      TEAMGRAM_CODE_MAX_ATTEMPTS: "${TEAMGRAM_CODE_MAX_ATTEMPTS:-0}"
      TEAMGRAM_GROUP_CALL_MEDIA_ENDPOINT: "${TEAMGRAM_GROUP_CALL_MEDIA_ENDPOINT:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_API_KEY: "${TEAMGRAM_GROUP_CALL_MEDIA_API_KEY:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_SIGNING_KEY: "${TEAMGRAM_GROUP_CALL_MEDIA_SIGNING_KEY:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_RTMP_HOST: "${TEAMGRAM_GROUP_CALL_MEDIA_RTMP_HOST:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_TIMEOUT_SECONDS: "${TEAMGRAM_GROUP_CALL_MEDIA_TIMEOUT_SECONDS:-5}"
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./docker/production/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks:
      - teamgram_net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --collector.textfile.directory=/textfile
    volumes:
      - "${TEAMGRAM_SLO_TEXTFILE_DIR:?Set the SLO textfile directory}:/textfile:ro"
    networks:
      - teamgram_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./teamgramd/deploy/prometheus/server/reliability.rules.yml:/etc/prometheus/reliability.rules.yml:ro
      - ./teamgramd/deploy/prometheus/server/slo-recording.rules.yml:/etc/prometheus/slo-recording.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - teamgram_net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    user: "${TEAMGRAM_ALERTMANAGER_UID:?Set to the rendered config owner UID}:${TEAMGRAM_ALERTMANAGER_GID:?Set to the rendered config owner GID}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager/data
    volumes:
      - "${TEAMGRAM_ALERTMANAGER_CONFIG:?Render the production Alertmanager config first}:/etc/alertmanager/alertmanager.yml:ro"
      - "${TEAMGRAM_ALERTMANAGER_DATA_DIR:?Set the persistent Alertmanager data directory}:/alertmanager/data"
    networks:
      - teamgram_net
    restart: unless-stopped

  # If this overlay is applied to a legacy Compose project, remove its MySQL
  # service instead of leaving a second production database running.
  mysql: !reset null

networks:
  teamgram_net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
