services:
  backend:
    image: teamgram-server-latest:20261007-r26-prod
    build: !reset null
    environment:
      TEAMGRAM_APIFULL_SCHEMA_READONLY: "true"
      TEAMGRAM_TURN_HOST: "${TEAMGRAM_TURN_HOST:-}"
      TEAMGRAM_TURN_PORT: "${TEAMGRAM_TURN_PORT:-3478}"
      TEAMGRAM_TURN_USERNAME: "${TEAMGRAM_TURN_USERNAME:-}"
      TEAMGRAM_TURN_PASSWORD: "${TEAMGRAM_TURN_PASSWORD:-}"
      TEAMGRAM_TURN_SHARED_SECRET: "${TEAMGRAM_TURN_SHARED_SECRET:-}"
      TEAMGRAM_TURN_CREDENTIAL_TTL_SECONDS: "${TEAMGRAM_TURN_CREDENTIAL_TTL_SECONDS:-3600}"
      TEAMGRAM_PAYMENT_PROVIDER_ENDPOINT: "${TEAMGRAM_PAYMENT_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_PAYMENT_PROVIDER_KEY: "${TEAMGRAM_PAYMENT_PROVIDER_KEY:-}"
      TEAMGRAM_PAYMENT_PROVIDER_SIGNING_KEY: "${TEAMGRAM_PAYMENT_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_PAYMENT_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_PAYMENT_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_AUTH_PROVIDER_ENDPOINT: "${TEAMGRAM_AUTH_PROVIDER_ENDPOINT:-}"
      TEAMGRAM_AUTH_PROVIDER_KEY: "${TEAMGRAM_AUTH_PROVIDER_KEY:-}"
      TEAMGRAM_AUTH_PROVIDER_SIGNING_KEY: "${TEAMGRAM_AUTH_PROVIDER_SIGNING_KEY:-}"
      TEAMGRAM_AUTH_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_AUTH_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_CODE_SMS_PROVIDER: "${TEAMGRAM_CODE_SMS_PROVIDER:-}"
      TEAMGRAM_CODE_EMAIL_PROVIDER: "${TEAMGRAM_CODE_EMAIL_PROVIDER:-}"
      TEAMGRAM_CODE_SEND_URL: "${TEAMGRAM_CODE_SEND_URL:-}"
      TEAMGRAM_CODE_EMAIL_SEND_URL: "${TEAMGRAM_CODE_EMAIL_SEND_URL:-}"
      TEAMGRAM_CODE_REPORT_MISSING_URL: "${TEAMGRAM_CODE_REPORT_MISSING_URL:-}"
      TEAMGRAM_CODE_VERIFY_URL: "${TEAMGRAM_CODE_VERIFY_URL:-}"
      TEAMGRAM_CODE_KEY: "${TEAMGRAM_CODE_KEY:-}"
      TEAMGRAM_CODE_SECRET: "${TEAMGRAM_CODE_SECRET:-}"
      TEAMGRAM_CODE_CHALLENGE_SECRET: "${TEAMGRAM_CODE_CHALLENGE_SECRET:-}"
      TEAMGRAM_CODE_REGION_ID: "${TEAMGRAM_CODE_REGION_ID:-}"
      TEAMGRAM_CODE_PROVIDER_TIMEOUT_SECONDS: "${TEAMGRAM_CODE_PROVIDER_TIMEOUT_SECONDS:-5}"
      TEAMGRAM_CODE_PROVIDER_RETRY_COUNT: "${TEAMGRAM_CODE_PROVIDER_RETRY_COUNT:-0}"
      TEAMGRAM_CODE_CHALLENGE_TTL_SECONDS: "${TEAMGRAM_CODE_CHALLENGE_TTL_SECONDS:-900}"
      TEAMGRAM_CODE_RATE_LIMIT: "${TEAMGRAM_CODE_RATE_LIMIT:-0}"
      TEAMGRAM_CODE_RATE_WINDOW_SECONDS: "${TEAMGRAM_CODE_RATE_WINDOW_SECONDS:-0}"
      TEAMGRAM_CODE_MAX_ATTEMPTS: "${TEAMGRAM_CODE_MAX_ATTEMPTS:-0}"
      TEAMGRAM_GROUP_CALL_MEDIA_ENDPOINT: "${TEAMGRAM_GROUP_CALL_MEDIA_ENDPOINT:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_API_KEY: "${TEAMGRAM_GROUP_CALL_MEDIA_API_KEY:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_SIGNING_KEY: "${TEAMGRAM_GROUP_CALL_MEDIA_SIGNING_KEY:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_RTMP_HOST: "${TEAMGRAM_GROUP_CALL_MEDIA_RTMP_HOST:-}"
      TEAMGRAM_GROUP_CALL_MEDIA_TIMEOUT_SECONDS: "${TEAMGRAM_GROUP_CALL_MEDIA_TIMEOUT_SECONDS:-5}"
