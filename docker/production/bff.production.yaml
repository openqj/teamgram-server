Name: bff.bff
ListenOn: 0.0.0.0:20010
DcId: 2
# This isolated deployment is an explicitly shared authority for DC 1 and 2.
# Leave this unset in a single-DC deployment so cross-DC transfers fail closed.
KnownDcIds:
  - 1
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 0
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

KV:
  - Host: redis:6379
PostgresDSN: postgres://teamgram:teamgram@postgres:5432/teamgram?sslmode=disable

PaymentProviderEndpoint: ${TEAMGRAM_PAYMENT_PROVIDER_ENDPOINT:-}
PaymentProviderKey: ${TEAMGRAM_PAYMENT_PROVIDER_KEY:-}
PaymentProviderSigningKey: ${TEAMGRAM_PAYMENT_PROVIDER_SIGNING_KEY:-}
PaymentProviderTimeoutSeconds: 5

SponsoredProviderEndpoint: ${TEAMGRAM_SPONSORED_PROVIDER_ENDPOINT:-}
SponsoredProviderKey: ${TEAMGRAM_SPONSORED_PROVIDER_KEY:-}
SponsoredProviderSigningKey: ${TEAMGRAM_SPONSORED_PROVIDER_SIGNING_KEY:-}
SponsoredProviderTimeoutSeconds: 5

CdnProviderEndpoint: ${TEAMGRAM_CDN_PROVIDER_ENDPOINT:-}
CdnProviderKey: ${TEAMGRAM_CDN_PROVIDER_KEY:-}
CdnProviderSigningKey: ${TEAMGRAM_CDN_PROVIDER_SIGNING_KEY:-}
CdnProviderTimeoutSeconds: 5

BotConnectionProviderEndpoint: ${TEAMGRAM_BOT_CONNECTION_PROVIDER_ENDPOINT:-}
BotConnectionProviderKey: ${TEAMGRAM_BOT_CONNECTION_PROVIDER_KEY:-}
BotConnectionProviderSigningKey: ${TEAMGRAM_BOT_CONNECTION_PROVIDER_SIGNING_KEY:-}
BotConnectionProviderTimeoutSeconds: 5

AuthProviderEndpoint: ${TEAMGRAM_AUTH_PROVIDER_ENDPOINT:-}
AuthProviderKey: ${TEAMGRAM_AUTH_PROVIDER_KEY:-}
AuthProviderSigningKey: ${TEAMGRAM_AUTH_PROVIDER_SIGNING_KEY:-}
AuthProviderTimeoutSeconds: 5

SearchPostsFlood:
  TotalDaily: 10

AIProviderEndpoint: ${TEAMGRAM_AI_PROVIDER_ENDPOINT:-}
AIProviderKey: ${TEAMGRAM_AI_PROVIDER_KEY:-}
AIProviderSigningKey: ${TEAMGRAM_AI_PROVIDER_SIGNING_KEY:-}
AIProviderModel: ${TEAMGRAM_AI_PROVIDER_MODEL:-gpt-6.1-sol}
AIProviderTimeoutSeconds: 5

BusinessProviderEndpoint: ${TEAMGRAM_BUSINESS_PROVIDER_ENDPOINT:-}
BusinessProviderKey: ${TEAMGRAM_BUSINESS_PROVIDER_KEY:-}
BusinessProviderSigningKey: ${TEAMGRAM_BUSINESS_PROVIDER_SIGNING_KEY:-}
BusinessProviderTimeoutSeconds: 5

PassportProviderEndpoint: ${TEAMGRAM_PASSPORT_PROVIDER_ENDPOINT:-}
PassportProviderKey: ${TEAMGRAM_PASSPORT_PROVIDER_KEY:-}
PassportProviderSigningKey: ${TEAMGRAM_PASSPORT_PROVIDER_SIGNING_KEY:-}
PassportProviderTimeoutSeconds: 5

UserChannelProfilesProviderEndpoint: ${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_ENDPOINT:-}
UserChannelProfilesProviderKey: ${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_KEY:-}
UserChannelProfilesProviderSigningKey: ${TEAMGRAM_USERCHANNELPROFILES_PROVIDER_SIGNING_KEY:-}
UserChannelProfilesProviderTimeoutSeconds: 5

TurnHost: ${TEAMGRAM_TURN_HOST:-}
TurnPort: ${TEAMGRAM_TURN_PORT:-0}
TurnUsername: ${TEAMGRAM_TURN_USERNAME:-}
TurnPassword: ${TEAMGRAM_TURN_PASSWORD:-}
TurnSharedSecret: ${TEAMGRAM_TURN_SHARED_SECRET:-}
TurnCredentialTTLSeconds: ${TEAMGRAM_TURN_CREDENTIAL_TTL_SECONDS:-3600}

Passkey:
  RelyingPartyId: ${TEAMGRAM_PASSKEY_RP_ID:-}
  RelyingPartyDisplayName: ${TEAMGRAM_PASSKEY_RP_DISPLAY_NAME:-}
  Origins: []
  TrustedApps: []

Code:
  Name: "none"
  SendCodeUrl: ""
  VerifyCodeUrl: ""
  Key: ""
  Secret: ""
  RegionId: ""

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
AuthSessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 0
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 0
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 0
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - kafka:9092
