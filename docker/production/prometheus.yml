global:
  scrape_interval: 15s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/reliability.rules.yml
  - /etc/prometheus/slo-recording.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: messenger.msg
    static_configs:
      - targets: [backend:20031]
  - job_name: messenger.sync
    static_configs:
      - targets: [backend:20421]
  - job_name: bff.bff
    static_configs:
      - targets: [backend:20011]
  - job_name: interface.gateway
    static_configs:
      - targets: [backend:20111]
  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
