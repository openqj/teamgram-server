global
  log stdout format raw local0
  maxconn 16384

defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  option redispatch
  timeout connect 5s
  timeout queue 30s
  timeout client 900s
  timeout server 900s
  timeout check 10s
  timeout http-request 10s
  timeout http-keep-alive 60s

frontend teamgram_s3_tls
  bind :443 ssl crt /etc/haproxy/tls/teamgram-s3.pem alpn h2,http/1.1
  http-request set-header X-Forwarded-Proto https
  default_backend teamgram_s3_gateways

backend teamgram_s3_gateways
  balance leastconn
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host teamgram-s3
  http-check expect rstatus (200|403|404)
  server gateway1 s3-gateway1:8333 check inter 3s fall 5s rise 2s maxconn 4096
  server gateway2 s3-gateway2:8333 check inter 3s fall 5s rise 2s maxconn 4096
