# Disposable local reliability lab. Always use a new teamgram-reliability-* project.
x-lab-labels: &lab-labels
  org.teamgram.reliability.run: "${TEAMGRAM_RELIABILITY_RUN_ID:?Use tools/postgres_recovery_probe.py or supply a new run ID}"

x-postgres-environment: &postgres-environment
  POSTGRES_DB: "${TEAMGRAM_RELIABILITY_DB:-teamgram_reliability}"
  POSTGRES_USER: teamgram_reliability
  POSTGRES_PASSWORD: "${TEAMGRAM_RELIABILITY_DB_PASSWORD:?A disposable database password is required}"
  TEAMGRAM_REPLICATION_PASSWORD: "${TEAMGRAM_RELIABILITY_REPLICATION_PASSWORD:?A disposable replication password is required}"
  TEAMGRAM_RECOVERY_TIMEOUT: "${TEAMGRAM_RELIABILITY_RECOVERY_TIMEOUT:-120}"
  # The recovery lab keeps this override separate from production. Capacity
  # probes set it explicitly when they need a larger disposable database.
  TEAMGRAM_RELIABILITY_PG_MAX_CONNECTIONS: "${TEAMGRAM_RELIABILITY_PG_MAX_CONNECTIONS:-256}"

services:
  postgres:
    image: postgres:18
    labels: *lab-labels
    environment: *postgres-environment
    entrypoint: ["/bin/bash", "/reliability/primary.sh"]
    ports:
      - "127.0.0.1:${TEAMGRAM_RELIABILITY_PG_PORT:-55435}:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - pg_archive:/archive
      - pg_backup:/backup
      - ./postgres:/reliability:ro
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"

  postgres-migrate:
    image: postgres:18
    labels: *lab-labels
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://teamgram_reliability:${TEAMGRAM_RELIABILITY_DB_PASSWORD:?A disposable database password is required}@postgres:5432/${TEAMGRAM_RELIABILITY_DB:-teamgram_reliability}?sslmode=disable"
    volumes:
      - ../../teamgramd/deploy:/workspace/teamgramd/deploy:ro
    entrypoint: ["/bin/bash", "/workspace/teamgramd/deploy/postgres/apply.sh"]
    restart: "no"

  postgres-standby:
    image: postgres:18
    profiles: [recovery]
    labels: *lab-labels
    depends_on:
      postgres:
        condition: service_healthy
    environment: *postgres-environment
    entrypoint: ["/bin/bash", "/reliability/standby.sh"]
    volumes:
      - standby_data:/var/lib/postgresql
      - ./postgres:/reliability:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"

  postgres-pitr:
    image: postgres:18
    profiles: [recovery]
    labels: *lab-labels
    environment:
      <<: *postgres-environment
      TEAMGRAM_RECOVERY_TARGET: teamgram_reliability_cutoff
    entrypoint: ["/bin/bash", "/reliability/pitr.sh"]
    volumes:
      - pitr_data:/var/lib/postgresql
      - pg_archive:/archive:ro
      - pg_backup:/backup:ro
      - ./postgres:/reliability:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    profiles: [messaging]
    labels: *lab-labels
    ports:
      - "127.0.0.1:${TEAMGRAM_RELIABILITY_KAFKA_PORT:-19094}:19094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${TEAMGRAM_RELIABILITY_KAFKA_PORT:-19094}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: "no"

  redis:
    image: redis:7-alpine
    profiles: [messaging]
    labels: *lab-labels
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    restart: "no"

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    profiles: [messaging]
    labels: *lab-labels
    environment:
      ETCD_NAME: lab
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: lab=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: teamgram-reliability
    volumes:
      - etcd_data:/etcd-data
    restart: "no"

  # Disposable reliability storage uses the same S3 contract as production.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    profiles: [backend]
    labels: *lab-labels
    command: [server, -s3, -dir=/data, -master.telemetry=false]
    environment:
      AWS_ACCESS_KEY_ID: "${TEAMGRAM_RELIABILITY_S3_ACCESS_KEY:-reliability-s3}"
      AWS_SECRET_ACCESS_KEY: "${TEAMGRAM_RELIABILITY_S3_SECRET_KEY:-reliability-s3-secret}"
    volumes:
      - object_data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"

  backend: &backend
    image: "${TEAMGRAM_RELIABILITY_IMAGE:-teamgram-reliability-image-required}"
    profiles: [backend]
    labels: *lab-labels
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      redis:
        condition: service_started
      etcd:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    environment:
      TEAMGRAM_POSTGRES_DSN: "postgresql://teamgram_reliability:${TEAMGRAM_RELIABILITY_DB_PASSWORD:?A disposable database password is required}@postgres:5432/teamgram_reliability?sslmode=disable"
      TEAMGRAM_SYNC_POSTGRES_MAX_CONNS: "${TEAMGRAM_SYNC_POSTGRES_MAX_CONNS:-16}"
      TEAMGRAM_KAFKA_HANDLER_CONCURRENCY: "${TEAMGRAM_KAFKA_HANDLER_CONCURRENCY:-64}"
      TEAMGRAM_APIFULL_SCHEMA_READONLY: "true"
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: "${TEAMGRAM_RELIABILITY_S3_ACCESS_KEY:-reliability-s3}"
      S3_SECRET_KEY: "${TEAMGRAM_RELIABILITY_S3_SECRET_KEY:-reliability-s3-secret}"
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
      S3_MAX_IDLE_CONNS: "${S3_MAX_IDLE_CONNS:-256}"
      S3_MAX_IDLE_CONNS_PER_HOST: "${S3_MAX_IDLE_CONNS_PER_HOST:-64}"
      S3_MAX_CONNS_PER_HOST: "${S3_MAX_CONNS_PER_HOST:-0}"
      S3_IDLE_CONN_TIMEOUT_SECONDS: "${S3_IDLE_CONN_TIMEOUT_SECONDS:-60}"
      S3_RESPONSE_HEADER_TIMEOUT_SECONDS: "${S3_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}"
      S3_UPLOAD_PART_SIZE_MIB: "${S3_UPLOAD_PART_SIZE_MIB:-16}"
      S3_UPLOAD_CONCURRENCY: "${S3_UPLOAD_CONCURRENCY:-4}"
    ports:
      - "127.0.0.1:${TEAMGRAM_RELIABILITY_MT_PORT:-21543}:11443"
    healthcheck:
      test: [CMD, /app/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s
    stop_grace_period: 45s
    restart: "no"

  backend-2:
    <<: *backend
    ports:
      - "127.0.0.1:${TEAMGRAM_RELIABILITY_MT_PORT_2:-21544}:11443"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    labels: *lab-labels
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    ports:
      - "127.0.0.1:${TEAMGRAM_RELIABILITY_METRICS_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../teamgramd/deploy/prometheus/server/reliability.rules.yml:/etc/prometheus/reliability.rules.yml:ro
      - ../../teamgramd/deploy/prometheus/server/slo-recording.rules.yml:/etc/prometheus/slo-recording.rules.yml:ro
      - prometheus_data:/prometheus
    restart: "no"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    labels: *lab-labels
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres:5432/${TEAMGRAM_RELIABILITY_DB:-teamgram_reliability}?sslmode=disable"
      DATA_SOURCE_USER: teamgram_reliability
      DATA_SOURCE_PASS: "${TEAMGRAM_RELIABILITY_DB_PASSWORD:?A disposable database password is required}"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ../production/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    restart: "no"

volumes:
  primary_data:
    labels: *lab-labels
  standby_data:
    labels: *lab-labels
  pitr_data:
    labels: *lab-labels
  pg_archive:
    labels: *lab-labels
  pg_backup:
    labels: *lab-labels
  kafka_data:
    labels: *lab-labels
  redis_data:
    labels: *lab-labels
  etcd_data:
    labels: *lab-labels
  object_data:
    labels: *lab-labels
  prometheus_data:
    labels: *lab-labels

networks:
  default:
    labels: *lab-labels
