global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/reliability.rules.yml
  - /etc/prometheus/slo-recording.rules.yml
scrape_configs:
  - job_name: messenger.msg
    static_configs:
      - targets: [backend:20031]
        labels:
          replica: backend-1
      - targets: [backend-2:20031]
        labels:
          replica: backend-2
  - job_name: messenger.sync
    static_configs:
      - targets: [backend:20421]
        labels:
          replica: backend-1
      - targets: [backend-2:20421]
        labels:
          replica: backend-2
  - job_name: bff.bff
    static_configs:
      - targets: [backend:20011]
        labels:
          replica: backend-1
      - targets: [backend-2:20011]
        labels:
          replica: backend-2
  - job_name: interface.gateway
    static_configs:
      - targets: [backend:20111]
        labels:
          replica: backend-1
      - targets: [backend-2:20111]
        labels:
          replica: backend-2
  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]
